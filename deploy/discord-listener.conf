# Optional systemd drop-in for mithril-web.service. Install only with the matching source.
[Service]
LoadCredential=discord-internal:/etc/mithril-discord/internal-secret.txt
Environment=MITHRIL_DISCORD_SECRET_FILE=%d/discord-internal
Environment=PYTHONPATH=/opt/mithril-web/current/backend
ExecStart=
ExecStart=/opt/mithril-web/current/.venv/bin/python -m mithril_web.serve
