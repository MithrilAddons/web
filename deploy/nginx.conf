limit_req_zone $binary_remote_addr zone=mithril_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=mithril_party:10m rate=60r/m;

# Reused connections for the party finder's held state requests.
upstream mithril_web {
    server 127.0.0.1:8780;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mithril.foo www.mithril.foo;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mithril-web-acme;
    }
    location / {
        return 301 https://mithril.foo$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mithril.foo;
    ssl_certificate /etc/letsencrypt/live/mithril.foo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mithril.foo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://mithril.foo$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mithril.foo;
    ssl_certificate /etc/letsencrypt/live/mithril.foo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mithril.foo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /opt/mithril-web/current/frontend/dist;
    index index.html;
    access_log off;
    client_max_body_size 4k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control no-cache always;

    location = /api/v1/mod-release {
        limit_req zone=mithril_party burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8780;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
        proxy_send_timeout 5s;
    }
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:8780;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }
    location ^~ /api/v1/auth/ {
        limit_req zone=mithril_auth burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8780;
        proxy_set_header Host $host;
        # Overwrite, never append browser-supplied addresses used for code limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
        proxy_send_timeout 5s;
    }
    # Held state requests last up to 25 s; listings are compressed (no secrets in them).
    location ^~ /api/v1/party/ {
        limit_req zone=mithril_party burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://mithril_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 40s;
        proxy_send_timeout 5s;
        proxy_buffering off;
        location = /api/v1/party/listings {
            limit_req zone=mithril_party burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://mithril_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 12s;
            gzip on;
            gzip_types application/json;
            gzip_min_length 1024;
        }
    }
    location /api/ {
        return 404;
    }
    location ~ /\. {
        deny all;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
