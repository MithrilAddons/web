[project]
name = "mithril-web"
version = "0.0.0"
description = "MithrilPF website backend foundation"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi==0.141.1", "uvicorn==0.54.0"]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.9"]

[tool.uv]
package = false
required-version = "==0.12.19"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".tools", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
