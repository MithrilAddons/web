[project]
name = "mithril-web"
version = "0.0.0"
description = "MithrilPF website backend foundation"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi==0.141.1", "uvicorn==0.54.0"]

[dependency-groups]
dev = [
    "coverage==7.16.2",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[tool.uv]
package = false
required-version = "==0.12.19"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-ra"

[tool.coverage.run]
branch = true
relative_files = true
source = ["backend/mithril_web", "tools"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".tools", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
