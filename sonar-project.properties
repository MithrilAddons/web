sonar.projectKey=MithrilAddons_web
sonar.organization=mithriladdons
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12,3.13,3.14
sonar.sources=backend/mithril_web,frontend,tools,deploy,contracts,.github,docs,eslint.config.js
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
# Exclude generated output and binary assets, not application source.
sonar.exclusions=frontend/public/favicon.png,frontend/dist/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.python.coverage.reportPaths=build/reports/coverage/python.xml
sonar.javascript.lcov.reportPaths=build/reports/coverage/frontend/lcov.info
sonar.python.xunit.reportPath=build/reports/python.xml
